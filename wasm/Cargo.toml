[package]
name = "prop_core"
version = "0.1.0"
edition = "2021"
description = "Rust/WebAssembly compute core for Prop Desk"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
